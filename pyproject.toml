[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-voz"
version = "0.1.0"
description = "MVP bootstrap for configurable voice assistant"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "jsonschema>=4.23.0",
  "faster-whisper>=1.0.3",
  "openai>=1.30.0",
  "google-genai>=0.6.0",
  "sounddevice>=0.4.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
