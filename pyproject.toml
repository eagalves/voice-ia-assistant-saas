[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-voz"
version = "0.1.0"
description = "MVP bootstrap for configurable voice assistant"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "jsonschema>=4.23.0",
  "faster-whisper>=1.0.3",
  "openai>=1.30.0",
  "google-genai>=0.6.0",
  "sounddevice>=0.4.6",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "testcontainers>=4.7",
  "aiosqlite>=0.20",
]

[project.scripts]
assistente-voz-server = "assistente_voz.server.__main__:main"
assistente-voz-export-openapi = "assistente_voz.server.cli.export_openapi:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
